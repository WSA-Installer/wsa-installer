[workspace]
resolver = "2"
members = [
    "aaptpp-core",
    "aaptpp-python",
    "aaptpp-ffi",
    "aaptpp-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["MR CYBER Dev"]
description = "Universal Android Package Tool - a production-ready AAPT replacement"

[workspace.dependencies]
flate2 = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
rcgen = "0.13"
x509-parser = "0.16"
log = "0.4"
jpeg-decoder = "0.3"
